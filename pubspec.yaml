name: next_gear
description: Sistema de consignação NEXT GEAR (Comercial, WMS, Consignação/Operação, Financeiro).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.4
  cloud_functions: ^5.1.4
  firebase_app_check: ^0.3.1+7
  firebase_messaging: ^15.1.3

  # Estado
  flutter_riverpod: ^2.5.1

  # Câmera / scanner de código de barras e QR
  mobile_scanner: ^5.2.3

  # Assinatura em tela
  signature: ^5.5.0

  # Geração e impressão de PDF
  pdf: ^3.11.1
  printing: ^5.13.2

  # Hash de documento
  crypto: ^3.0.5

  # Utilitários
  uuid: ^4.5.1
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  http: ^1.6.0

  # Compressão de imagens
  flutter_image_compress: ^2.3.0

  cupertino_icons: ^1.0.8
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo_nextgear.png
    - assets/images/app_icon.png

flutter_launcher_icons:
  android: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#121416"
  adaptive_icon_foreground: assets/images/app_icon.png
  adaptive_icon_foreground_inset: 20

  web:
    generate: true
    image_path: assets/images/app_icon.png
    background_color: "#121416"
    theme_color: "#76FF03"
